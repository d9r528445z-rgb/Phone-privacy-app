# XcodeGen spec — generates FamilyGuardParent.xcodeproj.
# Install XcodeGen (brew install xcodegen), then run: xcodegen generate
#
# This spec generates its own Info.plist from the `info.properties` below, so you do
# NOT need the hand-written Info.plist when using XcodeGen. (That file is only for the
# "create the project by hand in Xcode" path in docs/BUILD_IOS.md.)
name: FamilyGuardParent
options:
  bundleIdPrefix: com.familyguard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  FamilyGuardParent:
    type: application
    platform: iOS
    sources:
      - path: FamilyGuardParent
        excludes:
          - Info.plist   # generated from info.properties instead
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Family Guard
        UILaunchScreen: {}
        # Required so iOS lets the app reach the child's phone on the LAN.
        NSLocalNetworkUsageDescription: >-
          Family Guard connects to your child's phone on your Wi-Fi to show their
          activity reports. No data leaves your local network.
        # Allow plain HTTP only to local/private addresses.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familyguard.parent
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
